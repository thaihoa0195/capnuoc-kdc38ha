<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cấp nước KDC 38 ha</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--glass:rgba(13,20,36,.88);--line:rgba(255,255,255,.1);--tx:#e8eefc;--mut:#8fa0c0;--acc:#38bdf8}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px Inter,system-ui,sans-serif}
#map{position:absolute;inset:0}
.box{position:absolute;z-index:1000;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
#top{top:10px;left:10px;display:flex;gap:6px;padding:6px}
.sc{border:2px solid transparent;background:rgba(255,255,255,.06);color:var(--tx);font:600 13px Inter;padding:9px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px}
.sc i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sc.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c)}
#panel{left:10px;bottom:10px;width:330px;padding:12px 14px}
#big{display:flex;align-items:baseline;gap:8px}#big b{font-size:44px;font-weight:800;line-height:1}#big small{color:var(--mut);font-size:12px}
#hrL{margin-left:auto;font-weight:800;font-size:20px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
#play{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:#04202e;font-size:14px;cursor:pointer;flex:none}
#hr{flex:1;accent-color:var(--acc)}
canvas{width:100%;height:92px;display:block;margin-top:6px}
#layers{top:10px;right:10px;display:flex;flex-direction:column;gap:5px;padding:8px;max-width:190px}
.ch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font:600 12px Inter;padding:6px 10px;border-radius:9px;cursor:pointer;text-align:left}
.ch i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.ch:not(.on){opacity:.4}.ch:not(.on) i{background:transparent;outline:2px solid var(--c);outline-offset:-2px}
#leg{right:10px;bottom:10px;padding:9px 11px;font-size:11px;color:var(--mut)}
#leg div{display:flex;gap:10px;align-items:center;margin:2px 0;flex-wrap:wrap}#leg span{display:flex;align-items:center;gap:4px}
#leg i{display:inline-block;width:10px;height:10px;border-radius:50%}#leg u{display:inline-block;width:16px;border-radius:2px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0f172a;color:var(--tx);border:1px solid var(--line)}
.pp b{font-size:15px}.pp div{margin-top:3px;color:var(--mut)}.pp em{font-style:normal;color:var(--tx);font-weight:600}
#err{position:absolute;z-index:2000;top:40%;left:50%;transform:translateX(-50%);background:#7f1d1d;padding:14px 18px;border-radius:12px;max-width:80%}
@media(max-width:700px){#panel{width:auto;right:10px}#leg{display:none}#layers{top:auto;bottom:208px;right:10px;flex-direction:row;flex-wrap:wrap;max-width:none;left:10px}.sc{padding:8px 10px;font-size:12px}#big b{font-size:34px}canvas{height:70px}}
</style></head><body>
<div id="map"></div>
<div class="box" id="top"></div>
<div class="box" id="layers"></div>
<div class="box" id="panel">
 <div id="big"><b id="pm">–</b><small>m · áp thấp nhất</small><span id="hrL"></span></div>
 <div class="row"><button id="play" aria-label="Chạy">▶</button><input id="hr" type="range" min="0" max="23" value="18"></div>
 <canvas id="c24" width="620" height="180"></canvas>
</div>
<div class="box" id="leg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SB='https://thyedvcadlstxcprzvtw.supabase.co/rest/v1/',KEY='sb_publishable_fdK94ntOkXc6xXdRiqztUA_arlPXiDB';
async function get(tb){let out=[],off=0;for(;;){const r=await fetch(SB+tb+'?select=*',{headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Range-Unit':'items',Range:off+'-'+(off+999)}});if(!r.ok)throw new Error(tb+' '+r.status);const j=await r.json();out=out.concat(j);if(j.length<1000)break;off+=1000}return out}
// Hydraulic solver: Hazen-Williams, Newton on nodal heads (same method as the report's model)
function solveNet(nodes,pipes,Hr,dem,D,warm){
  // nodes: ids[]; pipes: {a,b,L,C} indices (-1 = reservoir); D: per-pipe diameter mm; dem: L/s per node
  const nn=nodes.length,np=pipes.length,n=1.852;
  const rr=pipes.map((p,k)=>10.67*p.L/(Math.pow(p.C,1.852)*Math.pow(D[k]/1000,4.871)));
  const q=dem.map(v=>v/1000);
  const H=warm?warm.slice():new Array(nn).fill(Hr);
  let it,res=0;
  for(it=0;it<400;it++){
    const F=q.map(v=>-v);
    const J=Array.from({length:nn},()=>new Float64Array(nn));
    for(let k=0;k<np;k++){
      const i=pipes[k].a,j=pipes[k].b;
      const hi=i<0?Hr:H[i],hj=j<0?Hr:H[j];
      const dh=hi-hj,ad=Math.abs(dh)+1e-9;
      const Qk=Math.sign(dh)*Math.pow(ad/rr[k],1/n);
      let g=(1/n)*Math.pow(1/rr[k],1/n)*Math.pow(ad,1/n-1);g=Math.min(g,1e4);
      if(i>=0){F[i]-=Qk;J[i][i]-=g}
      if(j>=0){F[j]+=Qk;J[j][j]-=g}
      if(i>=0&&j>=0){J[i][j]+=g;J[j][i]+=g}
    }
    res=0;for(let i=0;i<nn;i++)res=Math.max(res,Math.abs(F[i]));
    if(res<1e-8)break;
    // solve J dH = -F (Gaussian elimination, partial pivot)
    const A=J.map((r,i)=>{const x=new Float64Array(nn+1);x.set(r);x[nn]=-F[i];return x});
    for(let c=0;c<nn;c++){let m=c;for(let r=c+1;r<nn;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;
      if(m!==c){const t=A[c];A[c]=A[m];A[m]=t}
      const pv=A[c][c]||1e-12;
      for(let r=c+1;r<nn;r++){const f=A[r][c]/pv;if(f!==0){for(let k=c;k<=nn;k++)A[r][k]-=f*A[c][k]}}}
    const dH=new Float64Array(nn);
    for(let i=nn-1;i>=0;i--){let s=A[i][nn];for(let k=i+1;k<nn;k++)s-=A[i][k]*dH[k];dH[i]=s/(A[i][i]||1e-12)}
    let mx=0;for(let i=0;i<nn;i++)mx=Math.max(mx,Math.abs(dH[i]));
    const st=mx<20?1:20/mx;
    for(let i=0;i<nn;i++)H[i]+=st*dH[i];
  }
  const Q=pipes.map((p,k)=>{const hi=p.a<0?Hr:H[p.a],hj=p.b<0?Hr:H[p.b];const dh=hi-hj;return Math.sign(dh)*Math.pow(Math.abs(dh)/rr[k],1/n)});
  const V=Q.map((x,k)=>Math.abs(x)/(Math.PI*Math.pow(D[k]/1000,2)/4));
  return {H,Q:Q.map(x=>x*1000),V,it,res};
}
// 24h extended-period run: hourly meter pressure + demand pattern
function run24(nodes,pipes,D,qavg,pat,pHour,Z){
  Z=Z||2.5;const out=[];let warm=null;
  for(let h=0;h<24;h++){
    const dem=qavg.map(v=>v*pat[h]);
    const r=solveNet(nodes,pipes,pHour[h]+Z,dem,D,warm);warm=r.H;
    const P=r.H.map(x=>x-Z);
    out.push({h,P,V:r.V,Q:r.Q,tot:dem.reduce((a,b)=>a+b,0),pm:pHour[h]});
  }
  return out;
}


const PAT=[0.5,0.4,0.35,0.3,0.4,0.8,1.3,1.5,1.4,1.2,1.1,1.1,1.2,1.1,1.0,1.0,1.2,1.6,1.8,1.5,1.2,1.0,0.8,0.6];
const SCN=[['G','Giả định','#f87171','d_hien_trang'],['A','PA-A','#34d399','d_pa_a'],['B','PA-B','#38bdf8','d_pa_b']];
const PB=[[0,'#7f1d1d'],[4,'#ef4444'],[6,'#fb923c'],[10,'#fbbf24'],[14,'#34d399'],[1e9,'#38bdf8']];
const pc=p=>PB.find(b=>p<b[0])[1];
const DNC={100:'#e2e8f0',150:'#22d3ee',200:'#818cf8',250:'#e879f9',300:'#f472b6'},DNW={100:2,150:3,200:4,250:5,300:6};
const TC={nha:'#fbbf24',kt:'#fbbf24',cc:'#f87171',truong:'#60a5fa',cv:'#4ade80',ubnd:'#c084fc',xlnt:'#9ca3af',den:'#d6a77a'};
const f1=v=>v.toFixed(1).replace('.',','),hh=h=>String(h).padStart(2,'0')+':00';
const st={sc:'A',h:18,play:null,on:{thua:1,ld:1,vh:1,hm:1,ong:1,nut:1,dh:1,nen:1}};
(async()=>{
try{
 const [vt,vg,vo,vn,vd]=await Promise.all([get('v_thua'),get('v_giaothong'),get('v_ong'),get('v_nut'),get('v_dongho')]);
 vo.sort((a,b)=>+a.id.slice(1)-+b.id.slice(1));
 const polys=g=>g.type=='Polygon'?[g.coordinates]:g.coordinates;
 const ll=c=>[c[1],c[0]];
 const NI={};vn.forEach((n,i)=>NI[n.id]=i);
 const DHT=NI['DHT'];
 const pipes=vo.map(r=>({a:NI[r.nut_dau],b:NI[r.nut_cuoi],L:+r.chieu_dai,C:140}));pipes.push({a:DHT,b:-1,L:5,C:140});
 const qavg=vn.map(n=>+n.nhu_cau_l_s);
 const jp=v=>typeof v=='string'?JSON.parse(v):v;const pH=jp(vd[0].p_gio);
 const SIM={},DN={};
 SCN.forEach(([k,,,f])=>{const d=vo.map(r=>+r[f]);d.push(300);DN[k]=d;SIM[k]=run24(vn,pipes,d,qavg,PAT,pH,2.5)});
 const pmin=k=>SIM[k].map(x=>Math.min(...x.P));
 const map=L.map('map',{maxZoom:21}).setView([10.8255,106.6165],17);
 const base=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19,attribution:'Esri'}).addTo(map);
 ['ld','vh','hm','thua','ong','nut','dh'].forEach((n,i)=>map.createPane(n).style.zIndex=410+i*10);
 const G={ld:L.layerGroup(),vh:L.layerGroup(),hm:L.layerGroup(),thua:L.layerGroup(),ong:L.layerGroup(),nut:L.layerGroup(),dh:L.layerGroup()};
 const GT={LD:['ld','#475569',.62],LDVH:['vh','#e5e7eb',.55],HEM:['hm','#fb923c',.55]};
 vg.forEach(r=>{const o=GT[r.loai_mat];if(o)polys(r.geometry).forEach(rs=>L.polygon(rs.map(x=>x.map(ll)),{pane:o[0],color:'#0b1220',weight:.4,fillColor:o[1],fillOpacity:o[2],interactive:false}).addTo(G[o[0]]))});
 vt.forEach(r=>polys(r.geometry).forEach(c=>L.polygon(c.map(x=>x.map(ll)),{pane:'thua',color:'#0b1220',weight:.6,fillColor:TC[r.loai]||'#999',fillOpacity:.45,interactive:false}).addTo(G.thua)));
 const PL=vo.map((r,i)=>{const l=L.polyline(r.geometry.coordinates.map(ll),{pane:'ong',lineCap:'round'}).addTo(G.ong);
  l.bindPopup(()=>{const s=SIM[st.sc][st.h];return `<div class="pp"><b>Ống ${r.id}</b><div>DN <em>${DN[st.sc][i]}</em> · ${Math.round(+r.chieu_dai)} m</div><div>v <em>${s.V[i].toFixed(2).replace('.',',')}</em> m/s · Q <em>${f1(Math.abs(s.Q[i]))}</em> L/s</div></div>`});return l});
 const NL=vn.map((n,i)=>{const m=L.circleMarker(ll(n.geometry.coordinates),{pane:'nut',radius:5,weight:1.5,color:'#0b1220',fillOpacity:1}).addTo(G.nut);
  m.bindPopup(()=>{const ps=SIM[st.sc].map(x=>x.P[i]);return `<div class="pp"><b>Nút ${n.id}</b><div>Áp <em>${f1(ps[st.h])}</em> m · ${hh(st.h)}</div><div>24 h: <em>${f1(Math.min(...ps))}</em> – <em>${f1(Math.max(...ps))}</em> m</div></div>`});return m});
 L.marker([vd[0].geometry.coordinates[1],vd[0].geometry.coordinates[0]],{pane:'dh',icon:L.divIcon({className:'',html:'<div style="width:24px;height:24px;border-radius:50%;background:#38bdf8;border:3px solid #fff;box-shadow:0 0 0 3px #0b1220"></div>',iconSize:[24,24],iconAnchor:[12,12]})}).bindTooltip('Đồng hồ tổng').addTo(G.dh);
 Object.values(G).forEach(g=>g.addTo(map));
 // UI
 const top_=document.getElementById('top');
 top_.innerHTML=SCN.map(s=>`<button class="sc" data-k="${s[0]}" style="--c:${s[2]}"><i></i>${s[1]}</button>`).join('');
 const LY=[['thua','Thửa','#fbbf24'],['ld','Lòng đường','#64748b'],['vh','Lề đường','#e5e7eb'],['hm','Hẻm','#fb923c'],['ong','Ống','#22d3ee'],['nut','Nút','#34d399'],['dh','Đồng hồ','#38bdf8'],['nen','Nền vệ tinh','#94a3b8']];
 layers.innerHTML=LY.map(l=>`<button class="ch on" data-l="${l[0]}" style="--c:${l[2]}"><i></i>${l[1]}</button>`).join('');
 layers.onclick=e=>{const b=e.target.closest('.ch');if(!b)return;const k=b.dataset.l;st.on[k]=!st.on[k];b.classList.toggle('on',!!st.on[k]);
  if(k=='nen'){st.on.nen?base.addTo(map):map.removeLayer(base)}else{st.on[k]?G[k].addTo(map):map.removeLayer(G[k])}legend()};
 top_.onclick=e=>{const b=e.target.closest('.sc');if(b){st.sc=b.dataset.k;draw()}};
 hr.oninput=()=>{st.h=+hr.value;draw()};
 play.onclick=()=>{if(st.play){clearInterval(st.play);st.play=null;play.textContent='▶'}else{play.textContent='❚❚';st.play=setInterval(()=>{st.h=(st.h+1)%24;hr.value=st.h;draw()},700)}};
 function legend(){leg.hidden=false;let h='';
  if(st.on.nut)h+='<div>'+[['#7f1d1d','<0'],['#ef4444','0–4'],['#fb923c','4–6'],['#fbbf24','6–10'],['#34d399','10–14'],['#38bdf8','≥14 m']].map(x=>`<span><i style="background:${x[0]}"></i>${x[1]}</span>`).join('')+'</div>';
  if(st.on.ong)h+='<div>'+[100,150,200].map(d=>`<span><u style="background:${DNC[d]};height:${DNW[d]}px"></u>${d}</span>`).join('')+'</div>';
  {const r=[['ld','Lòng đường','#475569'],['vh','Lề đường','#e5e7eb'],['hm','Hẻm','#fb923c']].filter(x=>st.on[x[0]]);if(r.length)h+='<div>'+r.map(x=>`<span><i style="background:${x[2]}"></i>${x[1]}</span>`).join('')+'</div>'}
  if(st.on.thua)h+='<div>'+[['nha','Nhà'],['cc','CC'],['truong','Trường'],['cv','C.viên'],['ubnd','UBND']].map(x=>`<span><i style="background:${TC[x[0]]}"></i>${x[1]}</span>`).join('')+'</div>';
  leg.innerHTML=h}
 function chart(){const cv=c24,g=cv.getContext('2d'),W=cv.width,H=cv.height,l=34,r=8,t=8,b=22,w=W-l-r,h=H-t-b;g.clearRect(0,0,W,H);
  const all=SCN.flatMap(s=>pmin(s[0]).map(v=>Math.max(v,-10)));const lo=Math.floor(Math.min(-10,...all)/10)*10,hi=30;
  const X=i=>l+w*i/23,Y=v=>t+h*(1-(Math.max(v,lo)-lo)/(hi-lo));
  g.font='500 20px Inter,sans-serif';g.fillStyle='#8fa0c0';g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.textAlign='right';
  for(let v=lo;v<=hi;v+=10){g.beginPath();g.moveTo(l,Y(v));g.lineTo(W-r,Y(v));g.stroke();g.fillText(v,l-5,Y(v)+7)}
  g.textAlign='center';for(let i=0;i<24;i+=6)g.fillText(i+'h',X(i),H-4);
  g.setLineDash([6,5]);g.strokeStyle='#fbbf24';g.beginPath();g.moveTo(l,Y(8));g.lineTo(W-r,Y(8));g.stroke();g.setLineDash([]);
  SCN.forEach(s=>{g.strokeStyle=s[2];g.lineWidth=s[0]==st.sc?5:2;g.globalAlpha=s[0]==st.sc?1:.55;g.beginPath();pmin(s[0]).forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke()});g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;g.beginPath();g.moveTo(X(st.h),t);g.lineTo(X(st.h),t+h);g.stroke();
  g.fillStyle=SCN.find(s=>s[0]==st.sc)[2];g.beginPath();g.arc(X(st.h),Y(pmin(st.sc)[st.h]),7,0,7);g.fill()}
 function draw(){const s=SIM[st.sc][st.h];
  document.querySelectorAll('.sc').forEach(b=>b.classList.toggle('on',b.dataset.k==st.sc));
  PL.forEach((l,i)=>{const d=DN[st.sc][i];l.setStyle({color:DNC[d],weight:DNW[d]*(map.getZoom()>=18?1.3:1),opacity:.95})});
  NL.forEach((m,i)=>m.setStyle({fillColor:pc(s.P[i])}));
  const mn=Math.min(...s.P);pm.textContent=f1(mn);pm.style.color=pc(mn);hrL.textContent=hh(st.h);chart();legend()}
 map.on('zoomend',draw);legend();draw();window.__ok={SIM:()=>Object.fromEntries(SCN.map(s=>[s[0],Math.min(...pmin(s[0]))]))};
}catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err">Không đọc được dữ liệu: '+e.message+'</div>')}
})();
</script></body></html>
