<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGIS Cấp nước KDC 38 ha</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--pn:#ffffffee;--ln:#d3dce6;--tx:#14202e;--mt:#5b6b7d;--acc:#0369a1;--road:#b8c2cd;--walk:#dfe5ea;--ranh:#0f172a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--pn:#0d1424ee;--ln:#27364d;--tx:#e8eefc;--mt:#8fa0c0;--acc:#38bdf8;--road:#3b4658;--walk:#222c3b;--ranh:#e2e8f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--pn:#0d1424ee;--ln:#27364d;--tx:#e8eefc;--mt:#8fa0c0;--acc:#38bdf8;--road:#3b4658;--walk:#222c3b;--ranh:#e2e8f0;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:13px Inter,system-ui,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#map:active{cursor:grabbing}
.box{position:absolute;z-index:5;background:var(--pn);border:1px solid var(--ln);border-radius:12px;backdrop-filter:blur(8px)}
#hd{top:10px;left:10px;padding:10px 14px;max-width:calc(100% - 20px)}#hd b{font-size:15px;font-weight:800}#hd div{color:var(--mt);font-size:11px;margin-top:2px}
#side{top:10px;right:10px;width:210px;padding:10px;max-height:calc(100% - 20px);overflow:auto}
#side h4{margin:8px 0 5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mt)}#side h4:first-child{margin-top:0}
.seg{display:flex;gap:4px}.seg button{flex:1;border:1px solid var(--ln);background:transparent;color:var(--tx);font:600 11px Inter;padding:6px 2px;border-radius:8px;cursor:pointer}.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ch{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer;font-size:12px;user-select:none}.ch input{accent-color:var(--acc);margin:0}.ch i{width:12px;height:12px;border-radius:3px;flex:none;background:var(--c)}.ch small{margin-left:auto;color:var(--mt);font-variant-numeric:tabular-nums}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0}.lg u{width:22px;height:0;border-top:var(--w) solid var(--c);border-radius:2px}.lg span{margin-left:auto;color:var(--mt);font-variant-numeric:tabular-nums}
#info{left:10px;bottom:10px;width:290px;padding:12px 14px;display:none}#info b{font-size:15px}#info div{margin-top:4px;color:var(--mt)}#info em{font-style:normal;color:var(--tx);font-weight:600}
#zm{left:10px;top:70px;display:flex;flex-direction:column}#zm button{width:34px;height:34px;border:0;background:transparent;color:var(--tx);font:600 18px Inter;cursor:pointer}#zm button+button{border-top:1px solid var(--ln)}
#src{left:10px;bottom:10px;font-size:10px;color:var(--mt);padding:5px 9px}
.lbl{font:600 7.5px Inter;fill:var(--tx);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:1.6px}
@media(max-width:700px){#side{top:auto;bottom:10px;width:auto;left:10px;max-height:40%}#info{bottom:auto;top:70px;left:10px;right:60px;width:auto}#src{display:none}}
</style>
</head><body>
<svg id="map"></svg>
<div class="box" id="hd"><b>Cấp nước KDC 38 ha Tân Thới Nhất, Q12</b><div>Cơ sở dữ liệu ArcGIS Pro → QGIS · VN-2000 105°45′ · mạng ống DN100–DN200</div></div>
<div class="box" id="zm"><button id="zi" aria-label="Phóng to">+</button><button id="zo" aria-label="Thu nhỏ">−</button><button id="zf" aria-label="Toàn cảnh">⌂</button></div>
<div class="box" id="side">
 <h4>Phương án đường kính</h4>
 <div class="seg" id="sc"><button data-k="d_hien_trang" class="on">Hiện trạng</button><button data-k="d_pa_a">PA A</button><button data-k="d_pa_b">PA B</button></div>
 <h4>Ống theo DN</h4><div id="lg"></div>
 <h4>Lớp dữ liệu</h4><div id="ly"></div>
</div>
<div class="box" id="info"></div>
<script>
const SB='https://thyedvcadlstxcprzvtw.supabase.co/rest/v1/',KEY='sb_publishable_fdK94ntOkXc6xXdRiqztUA_arlPXiDB';
async function get(tb){let out=[],off=0;for(;;){const r=await fetch(SB+tb+'?select=*',{headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Range-Unit':'items',Range:off+'-'+(off+999)}});if(!r.ok)throw new Error(tb+' '+r.status);const j=await r.json();out=out.concat(j);if(j.length<1000)break;off+=1000}return out}
const FC=rows=>({type:'FeatureCollection',features:rows.map(r=>{const p={...r};const g=p.geometry;delete p.geometry;return{type:'Feature',geometry:g,properties:p}})});
(async()=>{try{
 const names=['ranh','thua','giaothong','ong','nut','dongho','tru_cuu_hoa','van'];
 const R=await Promise.all(names.map(n=>get('v_'+n)));
 const D={ranh:FC(R[0]),thua:FC(R[1]),gt:FC(R[2]),ong:FC(R[3]),nut:FC(R[4]),dh:FC(R[5]),tru:FC(R[6]),van:FC(R[7])};
 D.ong.features.sort((a,b)=>+a.properties.id.slice(1)-+b.properties.id.slice(1));
 boot(D)}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="box" style="top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 18px">Không tải được dữ liệu: '+e.message+'</div>')}})();
function boot(D){

const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map');
let lat0=10.8265,lon0=106.6155,KX=111320*Math.cos(lat0*Math.PI/180),KY=110574;
const P=c=>[(c[0]-lon0)*KX,-(c[1]-lat0)*KY];
const st={k:'d_hien_trang',on:{ranh:1,thua:1,gt:1,ong:1,nut:0,van:1,tru:1,dh:1}};
const DNC={100:'#38bdf8',150:'#ef4444',200:'#22c55e'},DNW={100:1.6,150:2.4,200:3.2};
const TC={};const palette=['#f59e0b','#a78bfa','#34d399','#fb7185','#60a5fa','#f472b6','#facc15','#94a3b8'];
const loaiList=[...new Set(D.thua.features.map(f=>f.properties.chuc_nang).filter(Boolean))];loaiList.forEach((l,i)=>TC[l]=palette[i%palette.length]);
const GT={};
const root=document.createElementNS(NS,'g');svg.appendChild(root);
const G={};['gt','thua','ranh','ong','nut','van','tru','dh','lb'].forEach(k=>{G[k]=document.createElementNS(NS,'g');root.appendChild(G[k])});
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e}
const ring=r=>'M'+r.map(c=>P(c).map(v=>v.toFixed(2)).join(' ')).join('L')+'Z';
const pathOf=g=>(g.type=='Polygon'?[g.coordinates]:g.coordinates).map(p=>p.map(ring).join('')).join('');
const info=document.getElementById('info');
function show(h){info.innerHTML=h;info.style.display='block'}
D.gt.features.forEach(f=>{const o=['','var(--road)'];mk('path',{d:pathOf(f.geometry),fill:o[1],stroke:'none'},G.gt)});
D.thua.features.forEach(f=>{const p=f.properties,e=mk('path',{d:pathOf(f.geometry),fill:TC[p.chuc_nang]||'#f59e0b','fill-opacity':.5,stroke:'var(--bg)','stroke-width':.6,'vector-effect':'non-scaling-stroke',style:'cursor:pointer'},G.thua);
 e.onclick=ev=>{ev.stopPropagation();show(`<b>Thửa · số nhà ${p.so_nha||'chưa có'}</b><div>Số thửa <em>${p.so_thua||'–'}</em> · đường <em>${p.ten_duong||'–'}</em></div><div>Chức năng <em>${p.chuc_nang||'chưa gán'}</em></div><div>Diện tích <em>${Math.round(p.shape_area||0)} m²</em></div>`)};
 const c=P(f.geometry.type=='Polygon'?f.geometry.coordinates[0][0]:f.geometry.coordinates[0][0][0])});
D.ranh.features.forEach(f=>mk('path',{d:pathOf(f.geometry),fill:'none',stroke:'var(--ranh)','stroke-width':2,'stroke-dasharray':'8 4','vector-effect':'non-scaling-stroke'},G.ranh));
const PI=D.ong.features.map(f=>{const p=f.properties,e=mk('path',{d:'M'+(f.geometry.type=='MultiLineString'?f.geometry.coordinates.flat():f.geometry.coordinates).map(c=>P(c).map(v=>v.toFixed(2)).join(' ')).join('L'),fill:'none','stroke-linecap':'round','stroke-linejoin':'round',style:'cursor:pointer'},G.ong);
 e.onclick=ev=>{ev.stopPropagation();const d=p[st.k],v=p[st.k.replace('d_','v_')];show(`<b>Ống ${p.id}</b><div>DN <em>${d}</em> · ${p.vat_lieu} · ${Math.round(p.chieu_dai)} m</div><div>Vận tốc <em>${v!=null?(+v).toFixed(2):'–'} m/s</em> · ${p.nut_dau} → ${p.nut_cuoi}</div>`)};return[e,p]});
D.nut.features.forEach(f=>{const p=f.properties,c=P(f.geometry.coordinates),e=mk('circle',{cx:c[0],cy:c[1],r:2.6,fill:'#34d399',stroke:'var(--bg)','stroke-width':.8,style:'cursor:pointer'},G.nut);
 e.onclick=ev=>{ev.stopPropagation();const k=st.k.replace('d_','p_'),a=p[k];show(`<b>Nút ${p.id}</b><div>Cao độ <em>${p.cao_do} m</em> · nhu cầu <em>${p.nhu_cau_l_s} L/s</em></div><div>Áp lực <em>${a!=null?(+a).toFixed(1):'–'} m</em></div>`)}});
D.van.features.forEach(f=>{const p=f.properties,c=P(f.geometry.coordinates),e=mk('rect',{x:c[0]-3,y:c[1]-3,width:6,height:6,transform:`rotate(45 ${c[0]} ${c[1]})`,fill:'#f59e0b',stroke:'var(--bg)','stroke-width':.8,style:'cursor:pointer'},G.van);
 e.onclick=ev=>{ev.stopPropagation();show(`<b>Van phân phối ${p.ma}</b><div>Ống <em>${p.ong}</em> · DN <em>${p.dn}</em> · nút <em>${p.nut}</em></div><div>${p.trang_thai} — ${p.ghi_chu}</div>`)}});
D.tru.features.forEach(f=>{const p=f.properties,c=P(f.geometry.coordinates),g=mk('g',{style:'cursor:pointer'},G.tru);
 mk('circle',{cx:c[0],cy:c[1],r:6.5,fill:'#dc2626',stroke:'#fff','stroke-width':1.5},g);const t=mk('text',{x:c[0],y:c[1]+2.8,'text-anchor':'middle',style:'font:800 8px Inter;fill:#fff;pointer-events:none'},g);t.textContent='H';
 g.onclick=ev=>{ev.stopPropagation();show(`<b>Trụ cứu hỏa ${p.ma}</b><div>Nút <em>${p.nut}</em> · bán kính phục vụ <em>${p.ban_kinh_phuc_vu_m} m</em></div><div>${p.trang_thai} — ${p.ghi_chu}</div>`)}});
D.dh.features.forEach(f=>{const p=f.properties,c=P(f.geometry.coordinates),g=mk('g',{style:'cursor:pointer'},G.dh);
 mk('circle',{cx:c[0],cy:c[1],r:10,fill:'#0284c7',stroke:'#fff','stroke-width':2},g);const t=mk('text',{x:c[0],y:c[1]+3.5,'text-anchor':'middle',style:'font:800 10px Inter;fill:#fff;pointer-events:none'},g);t.textContent='ĐH';
 g.onclick=ev=>{ev.stopPropagation();show(`<b>Đồng hồ tổng</b><div>${p.ten||p.id}</div><div>Áp thiết kế <em>${p.p_thiet_ke??'–'} m</em></div>`)}});
function paint(){PI.forEach(([e,p])=>{const d=p[st.k];e.setAttribute('stroke',DNC[d]||'#999');e.setAttribute('stroke-width',DNW[d]||2);e.setAttribute('vector-effect','non-scaling-stroke')});
 const cnt={},len={};D.ong.features.forEach(f=>{const d=f.properties[st.k];cnt[d]=(cnt[d]||0)+1;len[d]=(len[d]||0)+f.properties.chieu_dai});
 document.getElementById('lg').innerHTML=[100,150,200].map(d=>`<div class="lg"><u style="--c:${DNC[d]};--w:${DNW[d]+1}px"></u>DN${d}<span>${cnt[d]||0} ống · ${Math.round(len[d]||0)} m</span></div>`).join('')}
// view
let vx=0,vy=0,sc0=1,k=1;const W=()=>svg.clientWidth,H=()=>svg.clientHeight;const scale=()=>k;
function apply(){root.setAttribute('transform',`translate(${vx} ${vy}) scale(${k})`);root.style.setProperty('--k',k);
 G.nut.style.display=st.on.nut&&1?'':'none';paint();
 root.querySelectorAll('circle,rect').forEach(e=>{});}
function fit(){let a=[1e9,1e9,-1e9,-1e9];D.ranh.features.forEach(f=>(f.geometry.type=='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates).forEach(p=>p[0].forEach(c=>{const q=P(c);a=[Math.min(a[0],q[0]),Math.min(a[1],q[1]),Math.max(a[2],q[0]),Math.max(a[3],q[1])]})));
 const w=a[2]-a[0],h=a[3]-a[1];k=Math.min(W()/w,H()/h)*.88;vx=W()/2-(a[0]+w/2)*k;vy=H()/2-(a[1]+h/2)*k;sc0=k;apply()}
function zoom(f,cx,cy){cx=cx??W()/2;cy=cy??H()/2;const n=Math.max(sc0*.4,Math.min(sc0*40,k*f));f=n/k;vx=cx-(cx-vx)*f;vy=cy-(cy-vy)*f;k=n;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.25:.8,e.clientX-r.left,e.clientY-r.top)},{passive:false});
const ptr=new Map();let last=0;
svg.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);svg.setPointerCapture(e.pointerId);last=0});
svg.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
 if(ptr.size==1){vx+=e.clientX-o[0];vy+=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);apply()}
 else{const ids=[...ptr.keys()],o2=ptr.get(ids.find(i=>i!=e.pointerId));const d0=Math.hypot(o[0]-o2[0],o[1]-o2[1]);ptr.set(e.pointerId,[e.clientX,e.clientY]);const d1=Math.hypot(e.clientX-o2[0],e.clientY-o2[1]);const r=svg.getBoundingClientRect();if(d0>0)zoom(d1/d0,(e.clientX+o2[0])/2-r.left,(e.clientY+o2[1])/2-r.top)}});
['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,e=>ptr.delete(e.pointerId)));
svg.addEventListener('click',()=>{info.style.display='none'});
zi.onclick=()=>zoom(1.5);zo.onclick=()=>zoom(1/1.5);zf.onclick=fit;
document.getElementById('sc').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.k=b.dataset.k;[...sc.children].forEach(x=>x.classList.toggle('on',x==b));paint()};
const LY=[['thua','Thửa đất','#f59e0b',D.thua.features.length],['gt','Giao thông (polygon)','#94a3b8',D.gt.features.length],['ranh','Ranh dự án','#e2e8f0',1],['ong','Ống cấp nước','#38bdf8',D.ong.features.length],['nut','Nút','#34d399',D.nut.features.length],['dh','Đồng hồ tổng','#0284c7',1],['tru','Trụ cứu hỏa','#dc2626',D.tru.features.length],['van','Van phân phối','#f59e0b',D.van.features.length]];
ly.innerHTML=LY.map(l=>`<label class="ch"><input type="checkbox" data-l="${l[0]}" ${st.on[l[0]]?'checked':''}><i style="--c:${l[2]}"></i>${l[1]}<small>${l[3]}</small></label>`).join('');
ly.onchange=e=>{const l=e.target.dataset.l;st.on[l]=e.target.checked?1:0;G[l].style.display=st.on[l]?'':'none'};
Object.keys(st.on).forEach(l=>G[l].style.display=st.on[l]?'':'none');
addEventListener('resize',fit);fit();

}
</script>
</body></html>
